# Harmony Jekyll theme general configurations

# Base URL
baseurl:

# Site live URL
url: https://prlz77.github.io

# Localhost
#url: https://127.0.0.1:4000

plugins:
  - jekyll-scholar

# Harmony theme configuration. Please change accordingly.
harmony:
  name: prlz77
  # Little description about your site
  description: An information compressor in a pale blue dot.
  # 'meta_description:' Write an awesome description for your new site here.
  # It will appear in your document head meta (for Google search results) and
  # in your feed.xml site description.
  meta_description: Solutions I found, projects i found interesting, etc.
  basetheme: theme-base-01 # pre defined thmes are darken, blue-water, redish.
  author: # Author details
    name: Pau
    email: pau.rodri1@gmail.com
    url: http://prlz77.github.io

  # Profile links, leave blank to ignore
  social:
    github: prlz77
    twitter: prlz77
    facebook:
    gplus: 113126019576725081194
    dribble:
    pinterest:
  # Toggle disclaimer in footer
  show_disclaimer: true

markdown: kramdown
timezone: Europe/Madrid
highlighter: rouge

# Permalinks
permalink:        pretty

exclude:
  - CNAME
  - Gemfile
  - Rakefile
  - README.md
  - .gitignore
  - .sass-cache
  - Gemfile.lock

# Sass conversion configs
sass:
  sass_dir: assets/css/_sass
  style: compressed

# Settings for comments helper
# Set 'provider' to the comment provider you want to use.
# Set 'provider' to false to turn commenting off globally.
#
comments :
  provider : false

# Jekyll-Scholar settings
scholar:
  style: apa
  locale: en

  sort_by: year
  order: descending

  group_by: none
  group_order: ascending

  source: _bibliography
  bibliography: publications.bib
  bibliography_template: "{{reference}}"

  replace_strings: true
  join_strings:    true

  bibtex_filters:
  - superscript
  - latex

  details_dir:    bibliography
  details_layout: bibtex.html
  details_link:   Details

  query: "@*"
