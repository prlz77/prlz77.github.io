<ul class="social-media">
    <li>
        <a href="#" id="footer-email" title="Email me">
            <i class="fa fa-envelope"></i>
        </a>
    </li>

    {% if site.harmony.social.twitter %}
    <li>
        <a title="Twitter" href="https://twitter.com/{{ site.harmony.social.twitter }}" target="_blank">
            <i class="fa fa-twitter"></i>
        </a>
    </li>
    {% endif %}

    {% if site.harmony.social.github %}
    <li>
        <a title="Github" href="https://github.com/{{ site.harmony.social.github }}" target="_blank">
            <i class="fa fa-github"></i>
        </a>
    </li>
    {% endif %}

    {% if site.harmony.social.scholar %}
    <li>
        <a title="Google Scholar" href="https://scholar.google.com/citations?user={{ site.harmony.social.scholar }}"
            target="_blank">
            <i class="fa fa-graduation-cap"></i>
        </a>
    </li>
    {% endif %}

    {% if site.harmony.social.linkedin %}
    <li>
        <a title="LinkedIn" href="https://www.linkedin.com/in/{{ site.harmony.social.linkedin }}" target="_blank">
            <i class="fa fa-linkedin"></i>
        </a>
    </li>
    {% endif %}
</ul>

<script>
    (function () {
        var rawEmail = '{{ site.data.cv.mail }}';
        var email = rawEmail.replace(/\[\s*at\s*\]/g, '@').replace(/\[\s*dot\s*\]/g, '.').replace(/\s/g, '');
        var emailLink = document.getElementById('footer-email');
        if (emailLink) {
            emailLink.addEventListener('click', function (e) {
                e.preventDefault();
                this.innerHTML = email;
                this.href = 'mailto:' + email;
            });
        }
    })();
</script>
